name: ci

on:
  push:
    branches: [main, "hl/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      # Only the router parser is imported by the tests; the engine and trellis
      # sources are built on the nodes, never here. TensorMeld is public: no token.
      - name: Fetch the pinned TensorMeld submodule
        shell: bash
        run: bash tools/ci-fetch-tensormeld.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Stdlib unit tests (no GPU, no network, no ssh)
        run: python -m unittest discover -s tests -t . -v
      - name: Install test runner
        run: python -m pip install -e ".[test]"
      - name: Full tests (no GPU, no network, no ssh)
        # pyproject.toml limits discovery to our tests even with populated submodules.
        run: python -m pytest -q

  node-python:
    name: node tool on Python 3.10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
      # hydraweave-node runs on the nodes' system python3 (>= 3.10).
      - name: Compile and run the read-only verbs
        run: |
          python -c "import py_compile, sys; [py_compile.compile(p, doraise=True) for p in sys.argv[1:]]" node/hydraweave-node node/*.py
          echo '{}' | python node/hydraweave-node version

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          # A path with spaces, as the install acceptance requires.
          path: "hydra weave src"
      - name: Fetch the pinned TensorMeld submodule
        working-directory: "hydra weave src"
        run: bash tools/ci-fetch-tensormeld.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "./hydra weave src/windows/install.ps1"
          & "$env:LOCALAPPDATA\hydraweave\hydraweave.cmd" config validate "hydra weave src/examples/cluster.example.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux venv install
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/hl venv"
          "$RUNNER_TEMP/hl venv/bin/python" -m pip install "./hydra weave src/third_party/tensormeld" -e "./hydra weave src"
          "$RUNNER_TEMP/hl venv/bin/hydraweave" config validate "hydra weave src/examples/cluster.example.json"
