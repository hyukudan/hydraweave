name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts only; manual runs never publish, even if false'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Check tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from tools.make_release import version
          assert os.environ['RELEASE_TAG'] == 'v' + version(), 'tag must match pyproject.toml version'
          PY
      - name: Fetch pinned router sources
        run: bash tools/ci-fetch-tensormeld.sh
      - name: Build source archives, wheel and sdist
        run: |
          python -m pip install build
          python tools/make_release.py --wheels > release-build.log 2>&1 || { tail -20 release-build.log; exit 1; }
          python -c "import json, os, pathlib; pathlib.Path('hydraweave/data/_build.json').write_text(json.dumps({'commit': os.environ['GITHUB_SHA']}))"
          python -m build > python-build.log 2>&1 || { tail -20 python-build.log; exit 1; }
          cp install.sh dist/install.sh
          python tools/make_release.py --checksums-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-core
          path: dist/*
          if-no-files-found: error

  node-engine:
    # Repository owners can opt into this expensive, best-effort compiler job.
    if: vars.HYDRAWEAVE_BUILD_NODE_ENGINE == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    container: rocm/dev-ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build gfx1151 engine without GPU access
        shell: bash
        run: |
          cmake -S third_party/engine -B engine-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_HIP_ARCHITECTURES=gfx1151 \
            -DCMAKE_HIP_COMPILER="$(python3 node/hydraweave_rocm.py)/bin/amdclang++" \
            -DSTRIX_ENABLE_HIP_RUNTIME=ON -DSTRIX_ENABLE_EXPERIMENTAL_Q4K_A8_RUNTIME=ON \
            > engine-build.log 2>&1 || { tail -20 engine-build.log; exit 1; }
          cmake --build engine-build --target strix-hip-decode-token -j2 \
            >> engine-build.log 2>&1 || { tail -20 engine-build.log; exit 1; }
          mkdir -p engine-package/bin dist
          cp engine-build/strix-hip-decode-token engine-package/bin/
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          from node.hydraweave_rocm import detect_rocm
          from tools.make_release import version
          binary = pathlib.Path('engine-package/bin/strix-hip-decode-token')
          info = {'version': version(), 'architecture': 'gfx1151', 'rocm_root': str(detect_rocm()),
                  'engine_commit': subprocess.check_output(['git', '-C', 'third_party/engine', 'rev-parse', 'HEAD'], text=True).strip(),
                  'binaries': {binary.name: hashlib.sha256(binary.read_bytes()).hexdigest()}}
          pathlib.Path('engine-package/MANIFEST.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
          version=$(python3 -c 'from tools.make_release import version; print(version())')
          tar -czf "dist/hydraweave-node-engine-${version}-linux-x86_64-gfx1151.tar.gz" -C engine-package .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-node-engine
          path: dist/hydraweave-node-engine-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [build, node-engine]
    if: >-
      always() && needs.build.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Include optional engine in checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 tools/make_release.py --checksums-only
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
