[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydraweave"
version = "0.1.0"
description = "Cluster integration and control"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
hydraweave = "hydraweave.cli:main"
hyperloom = "hydraweave.cli:main"
hloom = "hydraweave.cli:main"

[tool.setuptools.packages.find]
include = ["hydraweave*", "hyperloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".*"]

[tool.setuptools.package-data]
hydraweave = ["presets/*.json", "data/*.json", "web/static/*", "web/static/pages/*", "web/static/assets/*", "bench/data/*.json", "recipes/builtin.json", "recipes/examples/*.toml", "recipes/examples/pending/*.toml"]

[tool.setuptools.data-files]
"share/hydraweave/node" = ["node/hydraweave-node"]
