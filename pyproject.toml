[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydraweave"
version = "0.1.0"
description = "Cluster integration and control"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
node = ["zeroconf>=0.132", "cmake>=3.24", "ninja>=1.11"]

[project.scripts]
hydraweave = "hydraweave.cli:main"
hydraweave-node = "hydraweave.node_agent:main"
hyperloom = "hydraweave.cli:main"
hloom = "hydraweave.cli:main"

[tool.setuptools.packages.find]
include = ["hydraweave*", "hyperloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".*"]

[tool.setuptools.package-data]
hydraweave = ["presets/*.json", "models/*.json", "data/*.json", "web/static/*", "web/static/pages/*", "web/static/assets/*", "bench/data/*.json", "recipes/builtin.json", "recipes/examples/*.toml", "recipes/examples/pending/*.toml"]

[tool.setuptools.data-files]
"share/hydraweave/node" = ["node/hydraweave-node", "node/*.py", "node/build-node.sh"]
"share/hydraweave" = ["versions.lock", "pyproject.toml", "LICENSE", "NOTICE"]
